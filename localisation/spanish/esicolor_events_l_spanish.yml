 esicolorpolitical.1.t: "Neutrals Demand Referendum"
 esicolorpolitical.2.t: "Neutrality on the Rise"
 esicolorpolitical.3.t: "[Root.Capital.GetName] Grill Party"
 esicolorpolitical.4.t: "The Threat of Extremism"

 esicolor_leader.1.t: "Marshal joins our Army"
 esicolor_leader.1.d: "After some negotiations, Marshal [This.GetName] has agreed to join our cause and will lead the troops of [From.GetName].\n\n[This.GetHerHisCap] capabilities are as follows:\nLevel: §0[?From.last_marshal_skill]§!, (£trait_attack §R[?From.last_marshal_attack]§!, £trait_defense §O[?From.last_marshal_defense]§!, £trait_planning §G[?From.last_marshal_planning]§!, £trait_logistics §B[?This.last_marshal_logistics]§!)\n\nAll that remains is [This.GetHerHim] getting an assignment."
 esicolor_leader.1.a: "[This.GetSheHeCap] will do a fine job."
 esicolor_leader.2.t: "General joins our Army"
 esicolor_leader.2.d: "After some negotiations, General [This.GetName] has agreed to join our cause and will lead the troops of [From.GetName].\n\n[This.GetHerHisCap] capabilities are as follows:\nLevel: §0[?From.last_general_skill]§!, (£trait_attack §R[?From.last_general_attack]§!, £trait_defense §O[?From.last_general_defense]§!, £trait_planning §G[?From.last_general_planning]§!, £trait_logistics §B[?From.last_general_logistics]§!)\n\nAll that remains is [This.GetHerHim] getting an assignment."
 esicolor_leader.3.t: "Admiral joins our Navy"
 esicolor_leader.3.d: "After some negotiations, Admiral [This.GetName] has agreed to join our cause and will lead the ships of [From.GetName].\n\n[This.GetHerHisCap] capabilities are as follows:\nLevel: §0[?From.last_admiral_skill]§!, (£trait_attack §R[?From.last_admiral_attack]§!, £trait_defense §O[?From.last_admiral_defense]§!, £trait_maneuvering §B[?From.last_admiral_maneuvering]§!, £trait_coordination §G[?From.last_admiral_coordination]§!)\n\nAll that remains is [This.GetHerHim] getting an assignment."

 esicolor_china.1.t: "[FROM.GetLeader] Requests Our Integration"
 esicolor_china.1.d: "A message from our comrades in [FROM.GetNameDef] arrived today. In short, [FROM.GetLeader] requests [THIS.GetNameDef]'s integration into [FROM.GetNameDef]. Should we put our differences aside for the sake of the revolution, or shall we continue our differences to break us apart."
 esicolor_china.1.a: "In your dreams, Revisionist!"
 esicolor_china.1.b: "Perhaps a middle ground could be found."
 esicolor_china.1.c: "Very well."

 esicolor_china.2.t: "[FROM.GetLeader] Rejects Integration"
 esicolor_china.2.d: "Our message from [FROM.GetNameDef] came back with a negative response. It seems like [FROM.GetLeader] thinks their view of Communism is superior to ours."
 esicolor_china.2.a: "Battlefield will show who's right."
 esicolor_china.2.b: "Their loss."

 esicolor_china.3.t: "[FROM.GetLeader] Offers Subjugation"
 esicolor_china.3.d: "Our message from [FROM.GetNameDef] came back with a counter offer. It seems like [FROM.GetLeader] is not yet ready to join us fully, but they agreed to closer cooperation with us."
 esicolor_china.3.a: "Not good enough for us."
 esicolor_china.3.b: "Very well."

 esicolor_china.4.t: "[FROM.GetLeader] Accepts Integration"
 esicolor_china.4.d: "Our message from [FROM.GetNameDef] came back positive. [FROM.GetNameDefCap] will join us in the path of the revolution."
 esicolor_china.4.a: "Cheers for unity."

 esicolor_formable_news.1.t: "Formation of [FROM.GetNameDef]"
 esicolor_formable_news.1.d: "Following their recent expansion the [FROM.GetOldAdjectiveCap] government has now begun increasing moves towards integration of the newly-conquered territories. Today, on [GetDateText], [FROM.GetOldAdjectiveCap] leader [FROM.GetLeader] gave a speech announcing the formation of '[FROM.GetNameDef]', calling it a major step in restoring the damage from the Great Collapse."
 esicolor_formable_news.1.a: "Cheers!"
 esicolor_formable_news.1.b: "Good for them."

 esicolor_formable_news.4.d: "Having retaken all the lands once ruled by Cnut the Great, the [From.GetOldAdjective] government has now begun increasing moves towards integration of the newly-conquered territories. As a result, in an attempt to rally the people behind the state, there has been an increase in pan-nationalist propaganda with clear support from the government.\n\nThe [FROM.GetOldAdjective] leader [FROM.GetLeader] has declared that the united Realms of Denmark, Norway, and England will from now on be known as '[From.GetNameDef]'."
